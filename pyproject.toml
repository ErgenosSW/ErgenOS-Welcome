[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ergenos-welcome"
version = "0.1.0"
description = "First-login welcome application for ErgenOS"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "ErgenOS Project"}]
dependencies = ["PyGObject"]

[project.urls]
Homepage = "https://github.com/ErgenosSW/ErgenOS-Welcome"
Issues = "https://github.com/ErgenosSW/ErgenOS-Welcome/issues"

[project.scripts]
ergenos-welcome = "ergenos_welcome.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
